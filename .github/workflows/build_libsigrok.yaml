name: 编译libsigrok
run-name: ${{ github.actor }}
on: [push]

env:
  HTTP_PROXY: ""

jobs:
  build_x86_64_w64_mingw32:
    runs-on: ubuntu-22.04
    steps:
      - name: 将存储库签出到运行器
        uses: actions/checkout@v6

      - name: 环境准备
        run: |
          cd $GITHUB_WORKSPACE
          sudo bash $GITHUB_WORKSPACE/build_env.sh
          source $GITHUB_WORKSPACE/build_env.sh
          echo "TOOLCHAIN_PATH=${TOOLCHAIN_PATH}" >> $GITHUB_ENV
          echo "BUILD_DIR=${BUILD_DIR}" >> $GITHUB_ENV
          echo "PREFIX=${PREFIX}" >> $GITHUB_ENV
          echo "TOOLCHAIN_PREFIX=${TOOLCHAIN_PREFIX}" >> $GITHUB_ENV
          echo "TARGET=${TARGET}" >> $GITHUB_ENV
          echo "PATH=${PATH}" >> $GITHUB_ENV
          echo "PROJECT_DIR=${PROJECT_DIR}" >> $GITHUB_ENV

          echo "TOOLCHAIN_PATH=${TOOLCHAIN_PATH}"
          echo "BUILD_DIR=${BUILD_DIR}"
          echo "PREFIX=${PREFIX}"
          echo "TOOLCHAIN_PREFIX=${TOOLCHAIN_PREFIX}"
          echo "TARGET=${TARGET}"
          echo "PATH=${PATH}"
          echo "PROJECT_DIR=${PROJECT_DIR}"

      - name: 编译
        id: build
        run: |
          cd $GITHUB_WORKSPACE
          set -o pipefail
          bash $GITHUB_WORKSPACE/corss_build.sh build_libsigrok.sh 2>&1 | tee build_log.txt
        continue-on-error: true

      - name: 打包libsigrok
        if: steps.build.outcome == 'success'
        run: |
          cd $PREFIX
          zip -r $GITHUB_WORKSPACE/libsigrok-${{ github.sha }}.zip .

      - name: 上传libsigrok
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: libsigrok-x86_64-w64-mingw32-${{ github.sha }}
          path: |
            ${{ github.workspace }}/libsigrok-${{ github.sha }}.zip
            ${{ github.workspace }}/build_log.txt
          retention-days: 30

      - name: 上传编译日志(编译失败时)
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: ${{ github.workspace }}/build_log.txt
          retention-days: 7
